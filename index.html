<title>Congresso Nacional de Sementes</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#01080f" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="images/icon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />

<div class="app">
  <!-- MENU PRINCIPAL -->
  <section id="view-menu" class="view active">
    <div class="background-network background-network-top"></div>
    <div class="background-network background-network-left"></div>
    <div class="background-network background-network-bottom"></div>

    <div class="seed-wrap" style="--w:110px;--h:72px;--top:-4%;--left:-7%;--rot:-24deg;--c1:#3f7bf0;--c2:#0f2a6e;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:52px;--h:34px;--top:20%;--right:2%;--rot:-12deg;--c1:#e6bd3a;--c2:#7a570b;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:34px;--h:34px;--top:36%;--left:1%;--rot:0deg;--c1:#22c7bf;--c2:#0a5f58;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:70px;--h:44px;--top:46%;--right:0%;--rot:16deg;--c1:#d84545;--c2:#6e1414;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:60px;--h:36px;--top:58%;--left:-3%;--rot:-18deg;--c1:#6cb83f;--c2:#274e12;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:18px;--h:18px;--top:63%;--right:22%;--rot:0deg;--c1:#7c8f2e;--c2:#333f0f;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:40px;--h:26px;--top:76%;--left:4%;--rot:-16deg;--c1:#e6bd3a;--c2:#7a570b;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:48px;--h:32px;--top:80%;--right:7%;--rot:20deg;--c1:#22c7bf;--c2:#0a5f58;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:56px;--h:56px;--bottom:-6%;--left:-5%;--rot:0deg;--c1:#d84545;--c2:#6e1414;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:96px;--h:56px;--bottom:-4%;--right:-6%;--rot:-14deg;--c1:#7c8f2e;--c2:#333f0f;"><div class="seed-trail"></div><div class="seed"></div></div>

    <header class="hero-header">
      <img src="images/buntech-agro.png" alt="Buntech Agro" class="buntech-logo" />
      <h1>Congresso Nacional<br class="mobile-break" /> de Sementes</h1>
      <p>Escolha uma opção abaixo</p>
    </header>

    <section class="actions">
      <button class="action-card action-card-primary" data-goto="view-form">
        <div class="action-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.364 13.634a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506l4.013-4.009a1 1 0 0 0-3.004-3.004z" /><path d="M14.487 7.858A1 1 0 0 1 14 7V2" /><path d="M20 19.645V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l2.516 2.516" /><path d="M8 18h1" /></svg>
        </div>
        <span>Formulário</span>
      </button>

      <button class="action-card action-card-secondary" data-goto="view-orcamento">
        <div class="action-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z" /><path d="M12 11h.01" /><path d="M16 11h.01" /><path d="M8 11h.01" /></svg>
        </div>
        <span>Solicite seu orçamento</span>
      </button>
    </section>

    <footer class="event-footer">
      <div class="footer-row">
        <a href="https://cbsementes.com/" target="_blank" rel="noopener" aria-label="Site do Congresso Brasileiro de Sementes">
          <img
            src="images/congresso-brasileiro-sementes.png"
            alt="XXIII Congresso Brasileiro de Sementes"
            class="congress-logo"
          />
        </a>
        <a id="linkedin-link" class="linkedin-badge" href="#" target="_blank" rel="noopener" aria-label="LinkedIn Buntech Agro">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </a>
      </div>
    </footer>
  </section>

  <!-- FORMULÁRIO DE CONTATO + PESQUISA -->
  <section id="view-form" class="view">
    <div class="card">
      <div class="section-title">Formulário</div>
      <p class="hint">Campos com * são obrigatórios.</p>

      <form id="form-contato" novalidate>
        <label>Nome *</label>
        <input type="text" name="nome" required />

        <label>Empresa *</label>
        <input type="text" name="empresa" required />

        <label>Departamento <span class="opt">(opcional)</span></label>
        <input type="text" name="departamento" />

        <label>E-mail *</label>
        <input type="email" name="email" required />

        <label>Telefone/Celular *</label>
        <input type="tel" name="telefone" required />

        <label>Cidade *</label>
        <input type="text" name="cidade" required />

        <label>Estado *</label>
        <input type="text" name="estado" required />

        <label>Produto <span class="opt">(opcional)</span></label>
        <select name="produto" id="select-produto">
          <option value="">Selecione</option>
          <option value="Seedgel">Seedgel</option>
          <option value="Hortaliças">Hortaliças</option>
          <option value="Seedflow">Seedflow</option>
          <option value="Grafite">Grafite</option>
          <option value="Polímeros">Polímeros</option>
          <option value="Outros">Outros</option>
        </select>
        <input
          type="text"
          name="produto_outro"
          id="input-produto-outro"
          placeholder="Qual produto?"
          style="display: none; margin-top: 8px"
        />

        <label>Comentários *</label>
        <textarea name="comentarios" required></textarea>

        <div class="error-msg" id="form-error">
          Preencha os campos obrigatórios antes de enviar.
        </div>

        <button type="submit" class="btn" id="btn-enviar" style="margin-top: 18px">
          Enviar
        </button>
      </form>
    </div>
    <button class="btn back" data-goto="view-menu">&larr; Voltar ao menu</button>
  </section>

  <!-- CONFIRMAÇÃO DE ENVIO -->
  <section id="view-form-ok" class="view">
    <div class="card success">
      <div class="emoji">✅</div>
      <h2>Obrigado!</h2>
      <p>Suas informações foram enviadas com sucesso.</p>
    </div>
    <button class="btn" data-goto="view-menu">Voltar ao menu</button>
  </section>

  <!-- ORÇAMENTO: FALE COM VENDEDORES -->
  <section id="view-orcamento" class="view">
    <div class="seed-wrap" style="--w:52px;--h:34px;--top:-3%;--left:-6%;--rot:-20deg;--c1:#6cb83f;--c2:#274e12;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:36px;--h:36px;--top:-4%;--right:-5%;--rot:0deg;--c1:#22c7bf;--c2:#0a5f58;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:30px;--h:30px;--top:16%;--left:-4%;--rot:0deg;--c1:#3f7bf0;--c2:#0f2a6e;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:40px;--h:26px;--top:24%;--right:-4%;--rot:-14deg;--c1:#e6bd3a;--c2:#7a570b;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:44px;--h:28px;--top:75%;--right:0%;--rot:16deg;--c1:#d84545;--c2:#6e1414;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:36px;--h:36px;--top:92%;--right:12%;--rot:0deg;--c1:#22c7bf;--c2:#0a5f58;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:40px;--h:26px;--top:92%;--left:2%;--rot:-15deg;--c1:#e6bd3a;--c2:#7a570b;"><div class="seed-trail"></div><div class="seed"></div></div>
    <div class="seed-wrap" style="--w:52px;--h:34px;--bottom:-2%;--left:2%;--rot:-18deg;--c1:#6cb83f;--c2:#274e12;"><div class="seed-trail"></div><div class="seed"></div></div>

    <div class="option-title">Fale com nossos vendedores:</div>
    <div class="option-list">
      <button class="option-card option-card-icon" data-wa="hortalicas">
        <span class="option-icon"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22c1.25-.987 2.27-1.975 3.9-2.2a5.56 5.56 0 0 1 3.8 1.5 4 4 0 0 0 6.187-2.353 3.5 3.5 0 0 0 3.69-5.116A3.5 3.5 0 0 0 20.95 8 3.5 3.5 0 1 0 16 3.05a3.5 3.5 0 0 0-5.831 1.373 3.5 3.5 0 0 0-5.116 3.69 4 4 0 0 0-2.348 6.155C3.499 15.42 4.409 16.712 4.2 18.1 3.926 19.743 3.014 20.732 2 22" /><path d="M2 22 17 7" /></svg></span>
        <span>Hortaliças</span>
      </button>
      <button class="option-card option-card-icon" data-wa="grandesCulturas">
        <span class="option-icon"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22 16 8" /><path d="M3.47 12.53 5 11l1.53 1.53a3.5 3.5 0 0 1 0 4.94L5 19l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z" /><path d="M7.47 8.53 9 7l1.53 1.53a3.5 3.5 0 0 1 0 4.94L9 15l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z" /><path d="M11.47 4.53 13 3l1.53 1.53a3.5 3.5 0 0 1 0 4.94L13 11l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z" /><path d="M20 2h2v2a4 4 0 0 1-4 4h-2V6a4 4 0 0 1 4-4Z" /><path d="M11.47 17.47 13 19l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L5 19l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z" /><path d="M15.47 13.47 17 15l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L9 15l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z" /><path d="M19.47 9.47 21 11l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L13 11l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z" /></svg></span>
        <span>Grandes culturas</span>
      </button>
      <button class="option-card option-card-icon" data-goto="view-forrageiras">
        <span class="option-icon"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5.172a2 2 0 0 0-.586-1.414L9.5 13.5" /><path d="M14.5 14.5 12 17" /><path d="M17 8.8A6 6 0 0 1 13.8 20H10A6.5 6.5 0 0 1 7 8a5 5 0 0 1 10 0z" /></svg></span>
        <span>Forrageiras/Pastagens</span>
      </button>
      <button class="option-card option-card-icon" data-wa="b2bInsumos">
        <span class="option-icon"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /><path d="M12 22V12" /><polyline points="3.29 7 12 12 20.71 7" /><path d="m7.5 4.27 9 5.15" /></svg></span>
        <span>B2B/Insumos</span>
      </button>
      <button class="option-card option-card-icon option-card-outline" data-goto="view-outros">
        <span class="option-icon"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M17 12h.01" /><path d="M12 12h.01" /><path d="M7 12h.01" /></svg></span>
        <span>Outros</span>
      </button>
    </div>
    <button class="btn back" data-goto="view-menu">&larr; Voltar ao menu</button>

    <footer class="event-footer">
      <img src="images/buntech-agro.png" alt="Buntech Agro" class="buntech-logo" />
    </footer>
  </section>

  <!-- ORÇAMENTO: FORRAGEIRAS -> REGIÃO -->
  <section id="view-forrageiras" class="view">
    <div class="option-title">Escolha sua região:</div>
    <div class="option-list">
      <button class="option-card" data-wa-forrageiras="saoPaulo">São Paulo</button>
      <button class="option-card" data-wa-forrageiras="minasGerais">Minas Gerais</button>
      <button class="option-card" data-wa-forrageiras="goias">Goiás</button>
      <button class="option-card" data-wa-forrageiras="bahia">Bahia</button>
      <button class="option-card" data-wa-forrageiras="matoGrosso">Mato Grosso</button>
      <button class="option-card" data-wa-forrageiras="matoGrossoSul">Mato Grosso do Sul</button>
    </div>

    <div class="field-panel">
      <label>Outra região <span class="opt">(descreva)</span></label>
      <input type="text" id="input-forrageiras-outro" placeholder="Digite sua região" />
      <button class="option-card option-card-outline" id="btn-forrageiras-outro" style="margin-top: 12px">
        Falar com vendedor
      </button>
    </div>
    <button class="btn back" data-goto="view-orcamento">&larr; Voltar</button>
  </section>

  <!-- ORÇAMENTO: OUTROS -->
  <section id="view-outros" class="view">
    <div class="option-title">Outros</div>
    <div class="field-panel">
      <label>Descreva o que você precisa</label>
      <input type="text" id="input-outros" />
      <button class="option-card" id="btn-outros" style="margin-top: 12px">
        Falar com vendedor
      </button>
    </div>
    <button class="btn back" data-goto="view-orcamento">&larr; Voltar</button>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
